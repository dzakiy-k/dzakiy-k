<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#111722" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="card-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.94" />
    </linearGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.65" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f6fc" />
      <stop offset="65%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="orb-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb-indigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb-emerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid-minor" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363d" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>
    <pattern id="grid-major" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="url(#grid-minor)" />
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.14" />
      <circle cx="120" cy="120" r="1.5" fill="#38bdf8" fill-opacity="0.35" />
    </pattern>

    <clipPath id="banner-clip">
      <rect x="0" y="0" width="1200" height="360" rx="14" ry="14" />
    </clipPath>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', Roboto, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      }
      .title {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: -0.02em;
        fill: url(#title-grad);
      }
      .subtitle {
        font-size: 16px;
        font-weight: 500;
        fill: #94a3b8;
        letter-spacing: 0.01em;
      }
      .telemetry {
        font-size: 11px;
        font-weight: 500;
        fill: #64748b;
        letter-spacing: 0.06em;
      }
      .tag-text {
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.05em;
      }
      .code-line {
        font-size: 12px;
        fill: #8b949e;
      }
      .orb-float-1 { animation: drift1 14s ease-in-out infinite alternate; }
      .orb-float-2 { animation: drift2 18s ease-in-out infinite alternate; }
      .orb-float-3 { animation: drift3 16s ease-in-out infinite alternate; }
      .pulse-dot { animation: pulse 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      .scanline { animation: scan 9s linear infinite; }
      .dash-flow { stroke-dasharray: 6 6; animation: dash 20s linear infinite; }
      @keyframes drift1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(45px, 25px) scale(1.08); }
      }
      @keyframes drift2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-50px, -30px) scale(1.12); }
      }
      @keyframes drift3 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(30px, -25px) scale(0.95); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes scan {
        0% { transform: translateY(-360px); opacity: 0; }
        15% { opacity: 0.45; }
        85% { opacity: 0.45; }
        100% { transform: translateY(360px); opacity: 0; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -240; }
      }
    </style>
  </defs>

  <g clip-path="url(#banner-clip)">
    <rect width="1200" height="360" fill="url(#bg-base)" />
    <circle class="orb-float-1" cx="220" cy="90" r="280" fill="url(#orb-cyan)" />
    <circle class="orb-float-2" cx="950" cy="270" r="320" fill="url(#orb-indigo)" />
    <circle class="orb-float-3" cx="720" cy="80" r="240" fill="url(#orb-emerald)" />
    <rect width="1200" height="360" fill="url(#grid-major)" />
    <rect class="scanline" x="0" y="0" width="1200" height="2" fill="url(#border-glow)" />

    <rect x="20" y="20" width="1160" height="320" rx="10" ry="10" fill="url(#card-surface)" stroke="#30363d" stroke-width="1" />
    <rect x="20" y="20" width="1160" height="2" fill="url(#border-glow)" />

    <path d="M 20 44 L 20 20 L 44 20" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 1156 20 L 1180 20 L 1180 44" fill="none" stroke="#6366f1" stroke-width="2" />
    <path d="M 20 316 L 20 340 L 44 340" fill="none" stroke="#10b981" stroke-width="2" />
    <path d="M 1156 340 L 1180 340 L 1180 316" fill="none" stroke="#38bdf8" stroke-width="2" />

    <g transform="translate(56, 54)">
      <rect x="0" y="-14" width="194" height="24" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1" />
      <circle class="pulse-dot" cx="14" cy="-2" r="4" fill="#10b981" />
      <text x="26" y="2" class="font-mono telemetry" fill="#10b981">SYS.ONLINE // @DZAKIY-K</text>
      <text x="218" y="2" class="font-mono telemetry">ARCH: FULL-STACK / AI ENGINE</text>
      <text x="428" y="2" class="font-mono telemetry">LOC: INDONESIA (UTC+7)</text>
    </g>

    <g transform="translate(56, 134)">
      <text x="0" y="0" class="font-sans title">MUHAMMAD DZAKIY KAMIL</text>
      <rect x="0" y="18" width="520" height="2" fill="url(#accent-line)" />
      <text x="0" y="48" class="font-sans subtitle">
        Full-Stack Developer, System Architect &amp; Creative Technologist
      </text>
      <text x="0" y="74" class="font-mono telemetry" fill="#64748b">
        Engineering multi-utility workspaces, automated Python engines, and interactive platforms.
      </text>
    </g>

    <g transform="translate(56, 250)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="186" height="32" rx="6" fill="#0d1117" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.55" />
        <circle cx="14" cy="16" r="3" fill="#38bdf8" />
        <text x="26" y="20" class="font-mono tag-text" fill="#38bdf8">FULL-STACK SYSTEMS</text>
      </g>
      <g transform="translate(198, 0)">
        <rect x="0" y="0" width="194" height="32" rx="6" fill="#0d1117" stroke="#6366f1" stroke-width="1" stroke-opacity="0.55" />
        <circle cx="14" cy="16" r="3" fill="#6366f1" />
        <text x="26" y="20" class="font-mono tag-text" fill="#818cf8">PYTHON &amp; AI ENGINE</text>
      </g>
      <g transform="translate(404, 0)">
        <rect x="0" y="0" width="198" height="32" rx="6" fill="#0d1117" stroke="#10b981" stroke-width="1" stroke-opacity="0.55" />
        <circle cx="14" cy="16" r="3" fill="#10b981" />
        <text x="26" y="20" class="font-mono tag-text" fill="#34d399">INTERACTIVE UI/UX</text>
      </g>
    </g>

    <g transform="translate(760, 56)">
      <rect x="0" y="0" width="384" height="248" rx="8" fill="#0d1117" fill-opacity="0.9" stroke="#30363d" stroke-width="1" />
      <rect x="0" y="0" width="384" height="28" rx="8" fill="#161b22" />
      <line x1="0" y1="28" x2="384" y2="28" stroke="#30363d" stroke-width="1" />

      <circle cx="16" cy="14" r="4.5" fill="#30363d" />
      <circle cx="30" cy="14" r="4.5" fill="#30363d" />
      <circle cx="44" cy="14" r="4.5" fill="#38bdf8" />
      <text x="64" y="18" class="font-mono telemetry" fill="#8b949e">dzakiy-k@aetherhub:~/manifest.ts</text>

      <g transform="translate(20, 52)" class="font-mono code-line">
        <text x="0" y="0"><tspan fill="#6366f1">export const</tspan> <tspan fill="#38bdf8">developer</tspan> = {</text>
        <text x="16" y="22">handle: <tspan fill="#10b981">"@dzakiy-k"</tspan>,</text>
        <text x="16" y="44">name: <tspan fill="#10b981">"Muhammad Dzakiy Kamil"</tspan>,</text>
        <text x="16" y="66">flagships: [</text>
        <text x="32" y="88"><tspan fill="#38bdf8">"AetherHub Studio"</tspan>,</text>
        <text x="32" y="110"><tspan fill="#818cf8">"Dhiva Academic Portal"</tspan>,</text>
        <text x="32" y="132"><tspan fill="#34d399">"Celestielle Lore Engine"</tspan></text>
        <text x="16" y="154">],</text>
        <text x="16" y="176">status: <tspan fill="#38bdf8">"Building Next-Gen Apps"</tspan></text>
        <text x="0" y="192">};</text>
      </g>

      <g transform="translate(275, 65)">
        <line class="dash-flow" x1="20" y1="20" x2="75" y2="55" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
        <line class="dash-flow" x1="75" y1="55" x2="35" y2="105" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6" />
        <line class="dash-flow" x1="35" y1="105" x2="20" y2="20" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6" />
        <circle cx="20" cy="20" r="5" fill="#0d1117" stroke="#38bdf8" stroke-width="2" />
        <circle cx="75" cy="55" r="5" fill="#0d1117" stroke="#6366f1" stroke-width="2" />
        <circle cx="35" cy="105" r="5" fill="#0d1117" stroke="#10b981" stroke-width="2" />
      </g>
    </g>

    <g transform="translate(56, 318)">
      <text x="0" y="0" class="font-mono telemetry">GITHUB.COM/DZAKIY-K</text>
      <text x="210" y="0" class="font-mono telemetry">//</text>
      <text x="234" y="0" class="font-mono telemetry">AETHERION ARCHIVE: 2026.1</text>
      <text x="430" y="0" class="font-mono telemetry">//</text>
      <text x="455" y="0" class="font-mono telemetry" fill="#38bdf8">THEME: OCEANIC_CYBER_DARK</text>
    </g>
  </g>
</svg>
